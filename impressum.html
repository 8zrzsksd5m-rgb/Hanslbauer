<!doctype html>
<html lang="de">
<head>

  <title>Impressum | Hanslbauer Purtlhof</title>
  <style>
    :root{--green:#183c2b;--green2:#315b40;--cream:#f7f4eb;--paper:#fffdf7;--gold:#c8a75b;--ink:#252a24;--muted:#6d746b;--line:#e3dfd2;--shadow:0 18px 55px #1a2b1d14}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    a{color:var(--green2)}
    header{background:var(--green);color:#fff;padding:22px clamp(22px,6vw,86px);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
    .brand{font:500 1.6rem Georgia,"Times New Roman",serif;color:#fff;text-decoration:none}
    header a.back{color:#fff}
    main{max-width:900px;margin:0 auto;padding:clamp(28px,6vw,72px) 22px;min-height:70vh}
    .eyebrow{color:var(--green2);font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;font-weight:800}
    h1,h2{font-family:Georgia,"Times New Roman",serif;line-height:1.15;font-weight:500}
    h1{font-size:clamp(2.6rem,6vw,4rem);margin:12px 0 28px}
    h2{font-size:1.55rem;margin:32px 0 10px}
    .panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(22px,4vw,38px);box-shadow:var(--shadow)}
    .notice{border-left:4px solid var(--gold);padding:12px 16px;background:#f5eedc;margin:0 0 24px}
    address{font-style:normal}
    footer{background:#112d20;color:#d1dbcf;padding:24px clamp(22px,6vw,86px);font-size:.85rem}
    footer a{color:#fff}
  </style>
</head>
<body>
  <header>

      <address>
